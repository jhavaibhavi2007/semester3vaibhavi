<!DOCTYPE html>
<html>
<head>
    <!-- <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>JavaScript Quiz Challenge</title>
    <style>
        body {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: white;
            margin: 20px;
            color: black;
        }

        .container {
            width: 480px;
            max-width: 95%;
            margin: 30px auto;
            background-color: white;
            border: 1px solid grey;
            padding: 20px;
        }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 2px solid grey;
            padding-bottom: 8px;
        }

        .progress-bar {
            font-size: 13px;
            color: gray;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 16px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            font-size: 14px;
            border: 1px solid grey;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 14px;
            margin-bottom: 10px;
            font-size: 14px;
            background-color: white;
            color: black;
            border: 1px solid grey;
            cursor: pointer;
            box-sizing: border-box;
        }

        .option-btn:hover:not(:disabled) {
            background-color: white;
        }

        .option-btn.selected {
            background-color: white;
            border-color: blue;
            font-weight: bold;
        }

        .option-btn.correct {
            background-color: green !important;
            color: white !important;
            border-color: darkgreen !important;
            font-weight: bold;
        }

        .option-btn.wrong {
            background-color: red !important;
            color: white !important;
            border-color: darkred !important;
        }

        .action-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .main-btn {
            padding: 8px 16px;
            font-size: 14px;
            background-color: slateblue;
            color: white;
            border: 1px solid blue;
            cursor: pointer;
        }

        .main-btn:disabled {
            background-color: white;
            border-color: grey;
            cursor: not-allowed;
        }

        .next-btn {
            background-color: slateblue;
            border-color: blue;
        }

        .error-message {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <script src = 'quiz.js'> </script>

<div class="container">

    <h1>JavaScript Quiz </h1>

    <div id="userSection">

        <p style="font-size: 14px; margin-bottom: 12px;"> Enter your name and section : </p>

        <div class="form-group">
            <label for="studentName"> Name </label>
            <input type="text" id="studentName" placeholder="Enter your full name">
            <div id="nameError" class="error-message"> Please enter your name </div>
        </div>

        <div class="form-group">
            <label for="studentSection"> Section </label>
            <input type="text" id="studentSection" placeholder="Enter your section">
            <div id="sectionError" class="error-message"> Please enter your section </div>
        </div>

        <div class="action-buttons">
            <button class="main-btn" onclick="startQuiz()"> Start Quiz </button>
        </div>
    </div>

    <div id="quizSection" style="display: none;">

        <div id="progressText" class="progress-bar"> Question 1 of 5 </div>

        <h3 id="questionHeading"> Question text goes here </h3>

        <div id="optionsContainer"> </div>

        <div id="selectionWarning" class="error-message"> Please select an option before submitting! </div>

        <div class="action-buttons">
            <button id="submitAnswerBtn" class="main-btn" onclick="submitCurrentAnswer()"> Submit Answer </button>
            <button id="nextQuestionBtn" class="main-btn next-btn" onclick="goToNextQuestion()" style="display: none;"> Next Question </button>
        </div>
    </div>
    
    <div id="resultSection" style="display: none;" class="result-box">
        <h2 style="font-size: 18px; margin-top: 5px;"> Quiz Finished! </h2>

        <p style="font-size: 14px; line-height: 1.6;">
            <strong> Student Name : </strong> <span id="resName"></span><br>
            <strong> Section : </strong> <span id="resSection"></span>
        </p>

        <h3 style="font-size: 22px; color: blue margin: 15px 0;" id="resScore"> Your Score: 0 / 5 </h3>

        <div class="action-buttons" style="justify-content: center;">
            <button class="main-btn" onclick="restartQuiz()"> Restart Quiz </button>
        </div>
    </div>
</div>

</body>
</html>
